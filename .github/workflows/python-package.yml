name: Python package

on:
  push:
    branches: [main, dev]
    tags:
      - 'mineru_vl_utils-*-released'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      # 发布标签必须与源码版本一致，禁止构建时改写分支或版本。
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          assignment = ast.parse(Path('mineru_vl_utils/version.py').read_text()).body[0]
          version = ast.literal_eval(assignment.value)
          expected = f'mineru_vl_utils-{version}-released'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          print(f'Building version {version} from {expected}')
          PY

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  check-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
          python -m pip check

      # 在源码目录外测试已安装 wheel；这两份测试需要可选推理后端。
      - name: Test installed wheel without optional engines
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q "$GITHUB_WORKSPACE/tests" \
            --ignore="$GITHUB_WORKSPACE/tests/test_scored.py" \
            --ignore="$GITHUB_WORKSPACE/tests/test_llama_cpp_engine_client.py"

  publish:
    needs: [build, check-install]
    if: github.repository == 'opendatalab/mineru-vl-utils' && startsWith(github.ref, 'refs/tags/mineru_vl_utils-') && endsWith(github.ref, '-released')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mineru-vl-utils/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      # PyPI 发布者须匹配 opendatalab/mineru-vl-utils、python-package.yml 和 pypi 环境。
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
