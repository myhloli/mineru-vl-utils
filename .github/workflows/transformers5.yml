name: Transformers 5 clients

on:
  pull_request:
  push:
    branches: [main, dev, codex/transformers-5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        transformers: ['5.10.1', '5.14.0', '5.16.1']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv
          uv pip install '.[transformers,llama-cpp,test]' 'transformers==${{ matrix.transformers }}'
          uv pip check
          source .venv/bin/activate
          python -m pytest tests/test_transformers5_clients.py tests/test_backend_input_lifecycle.py tests/test_llama_cpp_engine_client.py -q

  vllm-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv venv
          uv pip install '.[test]'
          uv run --no-project python scripts/check_vllm_contracts.py --cache .cache/vllm-source --output vllm-contracts.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vllm-source-contracts
          path: vllm-contracts.json
